name: siaga_tani
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  persistent_bottom_nav_bar: ^6.2.1

  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  google_sign_in: ^6.2.1

  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  intl: ^0.20.2
  get: ^4.7.2
  uuid: ^4.5.2
  google_generative_ai: ^0.4.7
  
  http: ^1.6.0
  flutter_dotenv: ^6.0.0
  url_launcher: ^6.3.2
  
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0

flutter_native_splash:
  color: "#E5EFD6" 
  image: assets/images/logo_app.png
  android_12:
    color: "#E5EFD6"
    image: assets/images/logo_app.png
  ios_content_mode: center
  fullscreen: true
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/phase/
    - assets/images/varietas/
    - assets/images/
    - assets/icons/
    - .env